<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <!-- PWA 및 iOS 모바일 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="성구 암송">
    <meta name="theme-color" content="#4338ca">
    <title>성구 암송 PWA</title>
    
    <!-- PWA 아이콘 등록 -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3389/3389081.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght=300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .scrollable-content {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="bg-slate-50">

    <!-- 1. 비밀번호 입력 화면 -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 text-center border border-slate-100">
            <div class="inline-flex p-4 bg-indigo-50 rounded-full text-indigo-600 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">성구 암송 프로그램</h1>
            <p class="text-xs text-gray-500 mb-6">보안 비밀번호를 입력해주세요.</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <input 
                    type="password" id="password-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" 
                    class="w-full px-4 py-3.5 border border-slate-200 rounded-2xl text-center text-3xl font-bold tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4 bg-slate-50 transition-all placeholder:tracking-normal placeholder:font-normal placeholder:text-lg"
                    autocomplete="off" required
                >
                <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-4 rounded-2xl hover:bg-indigo-700 transition-all active:scale-[0.98] shadow-lg shadow-indigo-100">
                    입장하기
                </button>
            </form>
            <p id="login-error" class="text-red-500 text-xs mt-3 hidden font-semibold">⚠️ 비밀번호가 일치하지 않습니다.</p>
        </div>
    </div>

    <!-- PWA 설치 권장 팝업 배너 -->
    <div id="pwa-install-banner" class="fixed bottom-4 left-4 right-4 bg-slate-900 text-white rounded-2xl p-4 shadow-2xl z-40 hidden flex items-center justify-between border border-slate-800">
        <div class="flex items-center gap-3">
            <img src="https://cdn-icons-png.flaticon.com/512/3389/3389081.png" class="w-10 h-10 rounded-lg" alt="앱 아이콘">
            <div>
                <p class="text-sm font-bold">홈 화면에 추가해 보세요!</p>
                <p class="text-[10px] text-slate-400">데이터 소모 없이 진짜 앱처럼 열립니다.</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="dismissPWAInstall()" class="text-xs text-slate-400 px-2 py-1">닫기</button>
            <button id="pwa-install-btn" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-bold">설치</button>
        </div>
    </div>

    <!-- 2. 메인 웹앱 화면 -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
        <header class="bg-white border-b border-slate-100 px-4 py-3.5 shrink-0">
            <div class="max-w-md mx-auto flex justify-between items-center">
                <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <span class="text-xl">📖</span> 성구 암송 <span class="text-xs font-normal text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">개역한글</span>
                </h1>
                <button onclick="logout()" class="text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-2 rounded-xl transition-all active:scale-95">
                    🔒 잠금
                </button>
            </div>
        </header>

        <main class="flex-1 scrollable-content max-w-md w-full mx-auto p-4 flex flex-col gap-4 pb-12">
            <!-- 시험 및 대그룹 성구 선택 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100/80">
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">시험 선택</label>
                <div class="relative">
                    <select id="exam-select" onchange="changeExam()" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                        </svg>
                    </div>
                </div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mt-4 mb-2">암송 범위</label>
                <div class="relative">
                    <select id="passage-select" onchange="changePassage()" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-slate-800 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none cursor-pointer">
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                            <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                        </svg>
                    </div>
                </div>
                <div id="sub-passage-tabs" class="flex flex-wrap gap-2 mt-3.5"></div>
            </div>

            <!-- 타이핑 암송 -->
            <section id="typing-mode-panel" class="flex flex-col gap-4">
            <!-- 가이드 및 실시간 힌트 패널 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100/80 flex flex-col gap-3">
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">힌트 가이드</span>
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="toggleHint('show')" id="btn-hint-show" class="text-xs px-2.5 py-1.5 rounded-lg transition-all">전체</button>
                        <button onclick="toggleHint('initial')" id="btn-hint-initial" class="text-xs px-2.5 py-1.5 rounded-lg transition-all">초성</button>
                        <button onclick="toggleHint('hide')" id="btn-hint-hide" class="text-xs px-2.5 py-1.5 rounded-lg transition-all">숨김</button>
                    </div>
                </div>
                <div id="guide-box" class="p-4 bg-slate-50 rounded-xl min-h-[5.5rem] flex items-center justify-center text-center">
                    <p id="guide-text" class="text-slate-700 font-semibold leading-relaxed select-text break-all text-sm sm:text-base"></p>
                </div>
            </div>

            <!-- 암송 타이핑 및 실시간 채점 패널 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100/80 flex flex-col gap-3 h-auto">
                <div class="flex flex-col gap-2 sm:flex-row sm:justify-between sm:items-center">
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">실시간 입력 확인 (띄어쓰기 및 괄호 무관)</span>
                    <div class="flex items-center justify-between gap-2 sm:justify-end">
                        <div class="flex gap-1 bg-slate-100 p-1 rounded-xl" aria-label="실시간 확인 설정">
                            <button type="button" id="btn-live-check-on" onclick="setLiveCheck(true)" aria-label="실시간 확인 켜기" aria-pressed="true" class="text-[10px] px-2.5 py-1 rounded-lg font-black transition-all active:scale-95 bg-white text-indigo-600 shadow-sm">ON</button>
                            <button type="button" id="btn-live-check-off" onclick="setLiveCheck(false)" aria-label="실시간 확인 끄기" aria-pressed="false" class="text-[10px] px-2.5 py-1 rounded-lg font-black transition-all active:scale-95 text-slate-400 hover:bg-white/60">OFF</button>
                        </div>
                        <span id="match-status" class="text-[10px] font-extrabold px-2.5 py-1 rounded-full transition-colors">작성 대기</span>
                    </div>
                </div>

                <!-- 실시간 글자 분석 뷰 (가독성 높은 구버전 스타일) -->
                <div id="comparison-display" class="p-4 bg-white text-slate-800 border border-slate-200/80 rounded-xl h-24 overflow-y-auto text-sm sm:text-base leading-relaxed break-words whitespace-pre-wrap font-semibold tracking-wide shadow-inner">
                    <span class="text-slate-400 text-xs font-normal">아래 입력창에 타이핑을 시작하면 실시간 분석이 표시됩니다.</span>
                </div>

                <div class="flex flex-col overflow-hidden h-32 mt-1">
                    <textarea 
                        id="user-input" oninput="compareText()" placeholder="이곳에 성구를 정확히 한 글자씩 타이핑하세요..." 
                        class="w-full h-full p-4 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none text-sm sm:text-base leading-relaxed bg-slate-50 focus:bg-white transition-all text-slate-800"
                        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                    ></textarea>
                </div>

                <button onclick="clearInput()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3.5 rounded-xl transition-all active:scale-[0.98] text-xs sm:text-sm">
                    지우고 처음부터 다시 쓰기
                </button>
            </div>
            </section>
        </main>

        <footer class="bg-white border-t border-slate-100 py-3 text-center text-[10px] text-slate-400 font-medium shrink-0">
            시몬지파 서대문교회 청년회 • 계시록 암송
        </footer>
    </div>

    <!-- 절 통과 성공 축하 모달 -->
    <div id="success-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-xs rounded-3xl shadow-2xl p-6 text-center border border-slate-50">
            <div class="inline-flex p-3 bg-emerald-100 text-emerald-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">참 잘하셨습니다!</h3>
            <p class="text-xs text-slate-500 mb-5">글자 틀림 없이 완벽히 맞추셨습니다.</p>
            <button onclick="closeSuccessModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition-all active:scale-95">
                다음 구절 도전하기
            </button>
        </div>
    </div>

    <!-- 최종 모든 구절 완독 축하 모달 -->
    <div id="complete-all-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 text-center border border-slate-50">
            <div class="inline-flex p-4 bg-amber-100 text-amber-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
            </div>
            <h3 id="complete-all-title" class="text-xl font-bold text-slate-900 mb-1"></h3>
            <p id="complete-all-message" class="text-xs text-slate-500 leading-relaxed mb-6"></p>
            <button onclick="restartFromBeginning()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl transition-all active:scale-95">
                처음부터 다시 연습하기
            </button>
        </div>
    </div>

    <script>
        // ⭐ [핵심 변경] 캐시 무시 및 자동 업데이트 서비스 워커 기술 엔진
        (function() {
            const manifest = {
                "name": "성구 암송 프로그램",
                "short_name": "성구 암송",
                "start_url": ".",
                "display": "standalone",
                "background_color": "#ffffff",
                "theme_color": "#4338ca",
                "orientation": "portrait",
                "icons": [{
                    "src": "https://cdn-icons-png.flaticon.com/512/3389/3389081.png",
                    "sizes": "512x512",
                    "type": "image/png",
                    "purpose": "any maskable"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            const manifestLink = document.createElement('link');
            manifestLink.setAttribute('rel', 'manifest');
            manifestLink.setAttribute('href', URL.createObjectURL(manifestBlob));
            document.head.appendChild(manifestLink);

            if ('serviceWorker' in navigator) {
                // 버전을 v6로 업데이트하면서 스마트 업데이트 로직 탑재
                const swCode = `
                    const CACHE_NAME = 'bible-memo-v10';
                    self.addEventListener('install', e => {
                        self.skipWaiting(); // 새로운 코드 발견 시 옛날 워커를 즉시 강제 종료
                    });
                    self.addEventListener('activate', e => {
                        self.clients.claim(); // 즉시 제어권 확보
                        e.waitUntil(
                            caches.keys().then(keys => Promise.all(
                                keys.map(key => { if(key !== CACHE_NAME) return caches.delete(key); })
                            ))
                        );
                    });
                    self.addEventListener('fetch', e => {
                        // [Network-First 전략] 인터넷이 되면 실시간으로 최신 깃허브 파일을 먼저 가져옴
                        e.respondWith(
                            fetch(e.request)
                                .then(res => {
                                    const resClone = res.clone();
                                    caches.open(CACHE_NAME).then(cache => cache.put(e.request, resClone));
                                    return res;
                                })
                                .catch(() => caches.match(e.request)) // 인터넷 안 될 때만 저장된 캐시 사용
                        );
                    });
                `;
                const swBlob = new Blob([swCode], {type: 'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).then(reg => {
                    // 서비스 워커의 업데이트가 발견되면 브라우저를 자동으로 새로고침시킴
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.location.reload();
                            }
                        });
                    });
                }).catch(() => {});
            }
        })();

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-install-banner').classList.remove('hidden');
        });
        document.getElementById('pwa-install-btn')?.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                document.getElementById('pwa-install-banner').classList.add('hidden');
            }
        });
        function dismissPWAInstall() { document.getElementById('pwa-install-banner').classList.add('hidden'); }

        // --- 데이터베이스 ---
        const EXAM_DATA = {
            "1차 시험": {
                "계 1:1-3": [
                    { ref: "계 1:1", text: "예수 그리스도의 계시라 이는 하나님이 그에게 주사 반드시 속히 될 일을 그 종들에게 보이시려고 그 천사를 그 종 요한에게 보내어 지시하신 것이라" },
                    { ref: "계 1:2", text: "요한은 하나님의 말씀과 예수 그리스도의 증거 곧 자기의 본 것을 다 증거하였느니라" },
                    { ref: "계 1:3", text: "이 예언의 말씀을 읽는 자와 듣는 자들과 그 가운데 기록한 것을 지키는 자들이 복이 있나니 때가 가까움이라" }
                ],
                "계 7:1-4": [
                    { ref: "계 7:1", text: "이 일 후에 내가 네 천사가 땅 네 모퉁이에 선 것을 보니 땅의 사방의 바람을 붙잡아 바람으로 하여금 땅에나 바다에나 각종 나무에 불지 못하게 하더라" },
                    { ref: "계 7:2", text: "또 보매 다른 천사가 살아계신 하나님의 인을 가지고 해 돋는 데로부터 올라와서 땅과 바다를 해롭게 할 권세를 얻은 네 천사를 향하여 큰 소리로 외쳐" },
                    { ref: "계 7:3", text: "가로되 우리가 우리 하나님의 종들의 이마에 인치기까지 땅이나 바다나 나무나 해하지 말라 하더라" },
                    { ref: "계 7:4", text: "내가 인맞은 자의 수를 들으니 이스라엘 자손의 각 지파 중에서 인맞은 자들이 십 사만 사천이니" }
                ],
                "계 10:10-11": [
                    { ref: "계 10:10", text: "내가 천사의 손에서 작은 책을 갖다 먹어버리니 내 입에는 꿀 같이 다나 먹은 후에 내 배에서는 쓰게 되더라" },
                    { ref: "계 10:11", text: "저가 내게 말하기를 네가 많은 백성과 나라와 방언과 임금에게 다시 예언하여야 하리라 하더라" }
                ],
                "계 20:4-6": [
                    { ref: "계 20:4", text: "또 내가 보좌들을 보니 거기 앉은 자들이 있어 심판하는 권세를 받았더라 또 내가 보니 예수의 증거와 하나님의 말씀을 인하여 목 베임을 받은 자의 영혼들과 또 짐승과 그의 우상에게 경배하지도 아니하고 이마와 손에 그의 표를 받지도 아니한 자들이 살아서 그리스도로 더불어 천년 동안 왕노릇 하니" },
                    { ref: "계 20:5", text: "(그 나머지 죽은 자들은 그 천년이 차기까지 살지 못하더라) 이는 첫째 부활이라" },
                    { ref: "계 20:6", text: "이 첫째 부활에 참예하는 자들은 복이 있고 거룩하도다 둘째 사망이 그들을 다스리는 권세가 없고 도리어 그들이 하나님과 그리스도의 제사장이 되어 천년 동안 그리스도로 더불어 왕노릇 하리라" }
                ],
                "계 22:18-19": [
                    { ref: "계 22:18", text: "내가 이 책의 예언의 말씀을 듣는 각인에게 증거하노니 만일 누구든지 이것들 외에 더하면 하나님이 이 책에 기록된 재앙들을 그에게 더하실 터이요" },
                    { ref: "계 22:19", text: "만일 누구든지 이 책의 예언의 말씀에서 제하여 버리면 하나님이 이 책에 기록된 생명 나무와 및 거룩한 성에 참예함을 제하여 버리시리라" }
                ]
            },
            "2차 시험": {
                "계 3:12-13": [
                    { ref: "계 3:12", text: "이기는 자는 내 하나님 성전에 기둥이 되게 하리니 그가 결코 다시 나가지 아니하리라 내가 하나님의 이름과 하나님의 성 곧 하늘에서 내 하나님께로부터 내려 오는 새 예루살렘의 이름과 나의 새 이름을 그이 위에 기록하리라" },
                    { ref: "계 3:13", text: "귀 있는 자는 성령이 교회들에게 하시는 말씀을 들을찌어다" }
                ],
                "계 12:10-11": [
                    { ref: "계 12:10", text: "내가 또 들으니 하늘에 큰 음성이 있어 가로되 이제 우리 하나님의 구원과 능력과 나라와 또 그의 그리스도의 권세가 이루었으니 우리 형제들을 참소하던 자 곧 우리 하나님 앞에서 밤낮 참소하던 자가 쫓겨 났고" },
                    { ref: "계 12:11", text: "또 여러 형제가 어린 양의 피와 자기의 증거하는 말을 인하여 저를 이기었으니 그들은 죽기까지 자기 생명을 아끼지 아니하였도다" }
                ],
                "계 15:4-5": [
                    { ref: "계 15:4", text: "주여 누가 주의 이름을 두려워하지 아니하며 영화롭게 하지 아니하오리이까 오직 주만 거룩하시니이다 주의 의로우신 일이 나타났으매 만국이 와서 주께 경배하리이다 하더라" },
                    { ref: "계 15:5", text: "또 이 일 후에 내가 보니 하늘에 증거 장막의 성전이 열리며" }
                ],
                "계 18:7-8": [
                    { ref: "계 18:7", text: "그가 어떻게 자기를 영화롭게 하였으며 사치하였든지 그만큼 고난과 애통으로 갚아 주라 그가 마음에 말하기를 나는 여황으로 앉은 자요 과부가 아니라 결단코 애통을 당하지 아니하리라 하니" },
                    { ref: "계 18:8", text: "그러므로 하루 동안에 그 재앙들이 이르리니 곧 사망과 애통과 흉년이라 그가 또한 불에 살라지리니 그를 심판하신 주 하나님은 강하신 자이심이니라" }
                ],
                "계 22:15-16": [
                    { ref: "계 22:15", text: "개들과 술객들과 행음자들과 살인자들과 우상 숭배자들과 및 거짓말을 좋아하며 지어내는 자마다 성밖에 있으리라" },
                    { ref: "계 22:16", text: "나 예수는 교회들을 위하여 내 사자를 보내어 이것들을 너희에게 증거하게 하였노라 나는 다윗의 뿌리요 자손이니 곧 광명한 새벽별이라 하시더라" }
                ]
            }
        };

        let currentExamKey = "1차 시험";
        let currentGroupKey = "계 1:1-3";
        let currentSubIndex = 0;
        let currentTargetText = "";
        let hintMode = "hide";
        let liveCheckEnabled = true;

        function handleLogin(event) {
            event.preventDefault();
            if (document.getElementById("password-input").value === "0314") {
                document.getElementById("login-screen").classList.add("hidden");
                document.getElementById("app-screen").classList.remove("hidden");
                initApp();
            } else {
                document.getElementById("login-error").classList.remove("hidden");
                document.getElementById("password-input").value = "";
                document.getElementById("password-input").focus();
            }
        }

        function logout() {
            document.getElementById("password-input").value = "";
            document.getElementById("login-error").classList.add("hidden");
            document.getElementById("login-screen").classList.remove("hidden");
            document.getElementById("app-screen").classList.add("hidden");
        }

        function initApp() {
            const examSelectEl = document.getElementById("exam-select");
            examSelectEl.innerHTML = "";
            Object.keys(EXAM_DATA).forEach(key => {
                const opt = document.createElement("option");
                opt.value = key;
                opt.textContent = key;
                examSelectEl.appendChild(opt);
            });

            currentExamKey = Object.keys(EXAM_DATA)[0];
            examSelectEl.value = currentExamKey;
            resetToFirstPassage();
            toggleHint('hide');
            loadPassage();
            setLiveCheck(liveCheckEnabled);
        }

        function getCurrentExamData() {
            return EXAM_DATA[currentExamKey];
        }

        function resetToFirstPassage() {
            currentGroupKey = Object.keys(getCurrentExamData())[0];
            currentSubIndex = 0;
            populatePassageSelect();
        }

        function populatePassageSelect() {
            const selectEl = document.getElementById("passage-select");
            selectEl.innerHTML = "";
            Object.keys(getCurrentExamData()).forEach(key => {
                const opt = document.createElement("option");
                opt.value = key;
                opt.textContent = key;
                selectEl.appendChild(opt);
            });
            selectEl.value = currentGroupKey;
        }

        function changeExam() {
            currentExamKey = document.getElementById("exam-select").value;
            document.getElementById("success-modal").classList.add("hidden");
            document.getElementById("complete-all-modal").classList.add("hidden");
            resetToFirstPassage();
            loadPassage();
        }

        function changePassage() {
            currentGroupKey = document.getElementById("passage-select").value;
            currentSubIndex = 0;
            loadPassage();
        }

        function loadPassage() {
            const passages = getCurrentExamData()[currentGroupKey];
            currentTargetText = passages[currentSubIndex].text;

            const tabsContainer = document.getElementById("sub-passage-tabs");
            tabsContainer.innerHTML = "";
            passages.forEach((p, idx) => {
                const btn = document.createElement("button");
                btn.textContent = p.ref;
                btn.className = `px-3.5 py-2 rounded-xl text-xs font-bold transition-all active:scale-95 ${
                    idx === currentSubIndex ? "bg-indigo-600 text-white shadow-md shadow-indigo-100" : "bg-slate-100 hover:bg-slate-200 text-slate-600"
                }`;
                btn.onclick = () => { currentSubIndex = idx; loadPassage(); };
                tabsContainer.appendChild(btn);
            });
            clearInput();
            updateGuide();
        }

        function toggleHint(mode) {
            hintMode = mode;
            ['btn-hint-show', 'btn-hint-initial', 'btn-hint-hide'].forEach(id => {
                document.getElementById(id).className = "text-xs px-3.5 py-1.5 rounded-lg font-semibold transition-all text-slate-500 hover:bg-slate-200/50";
            });
            document.getElementById('btn-hint-' + mode).className = "text-xs px-3.5 py-1.5 rounded-lg font-bold transition-all bg-white text-indigo-600 shadow-sm";
            updateGuide();
        }

        function updateGuide() {
            const text = currentTargetText;
            const el = document.getElementById("guide-text");
            if (hintMode === "show") {
                el.textContent = text; el.className = "text-slate-800 font-bold leading-relaxed text-sm sm:text-base";
            } else if (hintMode === "initial") {
                el.textContent = getKoreanInitials(text); el.className = "text-indigo-600 font-black tracking-wider leading-relaxed text-sm sm:text-base";
            } else {
                el.textContent = "눈을 감고 머릿속으로 그리며 적어보세요!"; el.className = "text-slate-400 font-medium leading-relaxed text-xs sm:text-sm";
            }
        }

        function getKoreanInitials(text) {
            const initials = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            let result = "";
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code >= 44032 && code <= 55203) {
                    result += initials[Math.floor((code - 44032) / 588)];
                } else { result += text.charAt(i); }
            }
            return result;
        }

        function clearInput() {
            document.getElementById("user-input").value = "";
            compareText();
        }

        function setLiveCheck(enabled) {
            liveCheckEnabled = enabled;
            const onButton = document.getElementById("btn-live-check-on");
            const offButton = document.getElementById("btn-live-check-off");
            const activeClass = "text-[10px] px-2.5 py-1 rounded-lg font-black transition-all active:scale-95 bg-white text-indigo-600 shadow-sm";
            const inactiveClass = "text-[10px] px-2.5 py-1 rounded-lg font-black transition-all active:scale-95 text-slate-400 hover:bg-white/60";

            onButton.className = enabled ? activeClass : inactiveClass;
            offButton.className = enabled ? inactiveClass : activeClass;
            onButton.setAttribute("aria-pressed", String(enabled));
            offButton.setAttribute("aria-pressed", String(!enabled));
            compareText();
        }

        function compareText() {
            const inputVal = document.getElementById("user-input").value;
            const targetText = currentTargetText;
            const display = document.getElementById("comparison-display");
            const status = document.getElementById("match-status");

            if (!inputVal) {
                display.innerHTML = liveCheckEnabled
                    ? `<span class="text-slate-400 text-xs font-normal">아래 입력창에 타이핑을 시작하면 실시간 분석이 표시됩니다.</span>`
                    : `<span class="text-slate-400 text-xs font-normal">실시간 확인이 꺼져 있습니다. 암송이 완료되면 자동으로 알려드립니다.</span>`;
                status.textContent = liveCheckEnabled ? "작성 대기" : "확인 OFF";
                status.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500";
                return;
            }

            const filterRegex = /[\s\(\)（）]/g;
            const targetChars = [...targetText.replace(filterRegex, '')];
            const inputChars = [...inputVal.replace(filterRegex, '')];

            let displayHTML = "";
            let isError = false;
            let pureUserIndex = 0;

            for (let i = 0; i < targetText.length; i++) {
                const targetChar = targetText[i];
                if (targetChar.match(filterRegex)) {
                    if (pureUserIndex < inputChars.length) displayHTML += escapeHTML(targetChar);
                    continue;
                }
                if (pureUserIndex < inputChars.length) {
                    const inputChar = inputChars[pureUserIndex];
                    if (inputChar === targetChar) {
                        displayHTML += `<span class="text-emerald-600 font-bold">${escapeHTML(targetChar)}</span>`;
                    } else {
                        displayHTML += `<span class="text-red-600 bg-red-50 font-bold px-0.5 rounded border-b-2 border-red-400">${escapeHTML(inputChar)}</span>`;
                        isError = true;
                    }
                    pureUserIndex++;
                } else { break; }
            }

            if (pureUserIndex < inputChars.length) {
                isError = true;
                while (pureUserIndex < inputChars.length) {
                    displayHTML += `<span class="text-red-600 bg-red-50 font-bold px-0.5 rounded border-b-2 border-red-400">${escapeHTML(inputChars[pureUserIndex])}</span>`;
                    pureUserIndex++;
                }
            }

            display.innerHTML = liveCheckEnabled
                ? displayHTML
                : `<span class="text-slate-400 text-xs font-normal">실시간 확인이 꺼져 있습니다. 암송이 완료되면 자동으로 알려드립니다.</span>`;

            if (!isError && inputChars.length === targetChars.length) {
                status.textContent = "암송 성공!";
                status.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700";
                document.getElementById("success-modal").classList.remove("hidden");
            } else if (!liveCheckEnabled) {
                status.textContent = "확인 OFF";
                status.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500";
            } else if (isError) {
                status.textContent = "오타 발생!";
                status.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-red-100 text-red-600";
            } else {
                status.textContent = "암송 타이핑 중";
                status.className = "text-[10px] font-extrabold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-600";
            }
        }

        function closeSuccessModal() {
            document.getElementById("success-modal").classList.add("hidden");
            const examData = getCurrentExamData();
            const passages = examData[currentGroupKey];
            if (currentSubIndex < passages.length - 1) {
                currentSubIndex++;
                loadPassage();
            } else {
                const keys = Object.keys(examData);
                const idx = keys.indexOf(currentGroupKey);
                if (idx < keys.length - 1) {
                    currentGroupKey = keys[idx + 1];
                    currentSubIndex = 0;
                    document.getElementById("passage-select").value = currentGroupKey;
                    loadPassage();
                } else {
                    document.getElementById("complete-all-title").textContent = `🎉 ${currentExamKey} 암송 완료!`;
                    document.getElementById("complete-all-message").textContent = `${currentExamKey}의 모든 암송 구절을 오타 없이 완료했습니다.`;
                    document.getElementById("complete-all-modal").classList.remove("hidden");
                }
            }
        }

        function restartFromBeginning() {
            document.getElementById("complete-all-modal").classList.add("hidden");
            resetToFirstPassage();
            loadPassage();
        }

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

    </script>
</body>
